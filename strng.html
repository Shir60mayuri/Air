<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let s="ababcaabbaaaa"
        let cnt=0
        for(let i=0; i<s.length; i++){
            console.log(s.charAt(i)) 
            if(s.charAt(i)=="a"){
                cnt++
            }
        }
        console.log("a="+cnt)


    </script>
</head>
<body>
    <center><h1>String function</h1></center>
</body>
</html>
